version: '3'

# Day-to-day commands; `task` alone lists them. CI is the gate; `task check`
# (scripts/check.ps1) runs all of it locally, and the lint and test tasks run pieces.

# The tasks every repo shares, from the shared-tooling submodule (shared:lint:scripts,
# shared:lint:md, shared:update and the rest).
includes:
  shared: ./shared/repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the frontend's dependencies (run `git submodule update --init` once first)
    dir: frontend
    cmds:
      # --prefer-offline: the Font Awesome Pro kit installs from npm's cache unless the lockfile changed.
      - npm ci --prefer-offline

  dev:
    desc: Run the API on :8080 and the Vite dev server on :5173 together (open http://localhost:5173)
    deps: [dev:backend, dev:frontend]

  dev:backend:
    desc: Run the API on :8080 against devdata, with Discord webhooks held back
    # The binary embeds the SPA's build (it serves it on :8080 too), so it builds first.
    deps: [build:web]
    dir: backend
    cmds:
      # devdata is a copy of the live database, real webhook URLs included.
      - 'go run . -addr :8080 -db ../devdata/database.sqlite -webroot ../devdata/webroot -log-file "" -webhook-dry-run'

  dev:frontend:
    dir: frontend
    cmds:
      - npm run dev

  # CI's generated job runs the same and fails on a difference. The binary embeds the
  # front end's build, so go run needs it.
  gen:
    desc: Regenerate sqlc's queries, the API's OpenAPI document and the SPA's types from it (and tygo's, until every domain is on huma), after a query or API change; commit the result
    deps: [build:web]
    cmds:
      - cd backend && sqlc generate
      - cd backend && go run . openapi > ../frontend/src/api/openapi.json
      - cd frontend && npx -y openapi-typescript@7.13.0 src/api/openapi.json -o src/api/schema.d.ts
      - cd frontend && npx prettier --write src/api/schema.d.ts src/api/openapi.json
      - cd frontend && npm run gen:types

  # The SPA's build, written where the Go binary embeds it (backend/internal/web/dist):
  # every Go build, test, lint and scan compiles it in, so each depends on this. Once
  # per run, so parallel steps share one build instead of emptying the folder under
  # each other, and only when its sources changed.
  build:web:
    desc: Build the frontend into backend/internal/web/dist, where the binary embeds it
    run: once
    dir: frontend
    cmds:
      - npm run build
    sources:
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - config/**/*
      - src/**/*
      - public/**/*
      - ../CHANGELOG.md
    generates:
      - ../backend/internal/web/dist/index.html

  build:
    desc: Build the frontend and compile the backend, which embeds it
    deps: [build:web]
    cmds:
      - cd backend && go build ./...

  build:plugin:
    desc: Build the Dalamud plugin in Release against this machine's Dalamud (XIVLauncher)
    dir: plugins/SenpanCompanion
    cmds:
      - dotnet build -c Release

  test:
    desc: Run the frontend (Vitest) and backend (Go) tests
    aliases: [tests, test:unit, tests:unit]
    cmds:
      - task: test:frontend
      - task: test:backend

  test:frontend:
    desc: Run the frontend's Vitest tests
    aliases: [tests:frontend]
    dir: frontend
    cmds:
      - npm test

  test:e2e:
    desc: Run the end-to-end suite (Playwright and axe) on the app as built, on a throwaway database
    aliases: [tests:e2e]
    deps: [build:web]
    dir: frontend
    cmds:
      - npm run test:e2e

  test:backend:
    desc: Run the Go tests (CI adds -race, which needs gcc here)
    aliases: [tests:backend]
    deps: [build:web]
    dir: backend
    cmds:
      - go test ./...

  lint:
    desc: Lint, format-check, and type-check the frontend, backend, scripts and docs
    cmds:
      - task: lint:frontend
      - task: lint:backend
      - task: lint:scripts
      - task: shared:lint:md
      - task: shared:repo:check
      - task: shared:version:check

  lint:frontend:
    dir: frontend
    cmds:
      - npm run lint:check
      - npm run format:check
      - npm run lint:conventions
      - npm run typecheck

  lint:backend:
    cmds:
      # backend/.golangci.yml is the shared template's; Senpan's rules are in .golangci.local.yml.
      - task: shared:golangci:check
        vars: { CLI_ARGS: '-dir backend' }
      - task: lint:backend:go

  lint:backend:go:
    internal: true
    deps: [build:web]
    dir: backend
    cmds:
      - go vet ./...
      # Built from source with the pinned toolchain, the same way CI installs it.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

  # PSScriptAnalyzer, with the shared settings, on every tracked script (the local
  # deploy.config.ps1 is the owner's and untracked). Install it once with
  # Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository
  lint:scripts:
    cmds:
      - task: shared:lint:scripts

  vuln:
    desc: Check dependencies for known vulnerabilities
    # govulncheck compiles the packages, the embedded SPA among them.
    deps: [build:web]
    cmds:
      # The version shared-tooling's go.yml runs in CI.
      - cd backend && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - cd frontend && npm audit --audit-level=high --omit=dev
      - task: shared:vuln

  check:
    desc: Everything CI runs (scripts/check.ps1); -- -SkipFrontend or -- -SkipBackend for half
    cmds:
      # The steps that don't depend on each other run at once, each line prefixed with
      # its task. -- -SkipFrontend or -- -SkipBackend still leave a half out.
      - task --parallel --output prefixed check:backend check:frontend check:plugin check:repo shared:vuln -- {{.CLI_ARGS}}

  # Both parts need the SPA's build (the backend compiles it in; the end-to-end suite's
  # server serves it), which build:web makes once for the parallel run.
  check:backend:
    desc: The backend part of task check (scripts/check.ps1 -Only backend)
    deps: [build:web]
    cmds:
      - pwsh -NoProfile -File scripts/check.ps1 -Only backend {{.CLI_ARGS}}

  check:frontend:
    desc: The frontend part of task check, end-to-end suite included (scripts/check.ps1 -Only frontend)
    deps: [build:web]
    cmds:
      - pwsh -NoProfile -File scripts/check.ps1 -Only frontend {{.CLI_ARGS}}

  check:plugin:
    desc: The plugin part of task check (scripts/check.ps1 -Only plugin)
    cmds:
      - pwsh -NoProfile -File scripts/check.ps1 -Only plugin {{.CLI_ARGS}}

  check:repo:
    desc: The scripts, docs and shared-file part of task check (scripts/check.ps1 -Only repo)
    cmds:
      - pwsh -NoProfile -File scripts/check.ps1 -Only repo {{.CLI_ARGS}}

  push:
    desc: Take the in-range updates Dependabot would open, scan for advisories, run task check, then push (-- -Yes, -SkipUpdates, -SkipCheck)
    interactive: true
    cmds:
      - task: shared:push

  # task deploy ships everything, in order, and each part also deploys alone: the app
  # (the binary, the SPA inside it), then the plugin, only when its version is new.
  # Each ships the newest release CI tagged, and does nothing when the host runs it
  # already (-- -Force deploys it again). The SPA is in the binary, so there is no
  # deploy:frontend.
  deploy:
    desc: Deploy everything - the app, then the plugin if its version is new (pass flags after --, e.g. -- -NoDbPull)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target app {{.CLI_ARGS}}
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target plugin -IfNewer {{.CLI_ARGS}}

  deploy:backend:
    desc: Deploy the app alone (the binary, with the SPA inside), then pull the live database into devdata (-- -NoDbPull skips the pull)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target app {{.CLI_ARGS}}

  deploy:plugin:
    desc: Build the Dalamud plugin from the newest release and publish it to its custom repo; refused unless its version is new
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target plugin {{.CLI_ARGS}}
