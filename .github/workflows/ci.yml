name: CI

# The full quality gate on every push and pull request, on shared-tooling's reusable
# workflows at the release the shared/ submodule holds (the docs job fails if the two
# ever differ): the Vue/TS frontend, the Go backend, the FFXIV plugin, the PowerShell
# scripts and the docs. scripts/check.ps1 runs the same checks locally.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint is lint:check, which never rewrites; test:coverage fails below the floor in
  # vitest.config.ts. web.yml runs the audit itself. The API types it compiles against
  # are the committed ones, which the generated job checks.
  frontend:
    uses: jwill89/shared-tooling/.github/workflows/web.yml@v2.2.3
    with:
      dir: frontend
      fontawesome: true
      scripts: lint:check format:check lint:conventions typecheck test:coverage build
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  # frontend/src/types/api.generated.ts is generated from the Go models by tygo (pinned
  # as a tool in backend/go.mod) and committed, as the other projects commit theirs; this
  # fails when the committed copy is not what the generator makes now.
  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: The API types are current
        working-directory: backend
        run: |
          go tool tygo generate
          git diff --exit-code -- ../frontend/src/types/api.generated.ts

  # golangci-lint with backend/.golangci.yml (written from the shared template), the
  # tests under the race detector with their coverage floor (63.3% of statements when
  # it was set, 2026-11-06; raise it as tests land, never lower it), govulncheck, and
  # the binary built as the deploy builds it.
  backend:
    uses: jwill89/shared-tooling/.github/workflows/go.yml@v2.2.3
    with:
      dir: backend
      coverage-floor: 63.0
      build: go build -ldflags="-s -w" -o app-suite .

  # Built against Dalamud with warnings as errors (the shared analyzers, imported by
  # plugins/Directory.Build.props), and dotnet format.
  plugin:
    uses: jwill89/shared-tooling/.github/workflows/dotnet.yml@v2.2.3
    with:
      projects: plugins/SenpanCompanion
      warnings-as-errors: true

  # The end-to-end run (frontend/playwright.config.ts): the API built and run on a
  # throwaway database with Discord held back (-webhook-dry-run), the built SPA under
  # vite preview, in the runner's Chrome. Every main page must pass axe at WCAG 2.2 AA,
  # and a player must join a board, see a draw arrive live and keep a stamp across a
  # reload.
  e2e:
    needs: [frontend, backend]
    uses: jwill89/shared-tooling/.github/workflows/e2e.yml@v2.2.3
    with:
      dir: frontend
      go-version-file: backend/go.mod
      fontawesome: true
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  scripts:
    uses: jwill89/shared-tooling/.github/workflows/pwsh.yml@v2.2.3

  docs:
    uses: jwill89/shared-tooling/.github/workflows/docs.yml@v2.2.3

  # OSV-Scanner over every lockfile. An osv-scanner.toml beside a lockfile passes over the
  # advisories that reach only lint, test or build tooling (standards/packages.md).
  osv:
    uses: jwill89/shared-tooling/.github/workflows/osv.yml@v2.2.3
    permissions:
      contents: read
      actions: read
      security-events: write

  # On a push to main, AFTER the whole gate passes, tag + release any component
  # whose current version has no release yet. Tags follow <Component>-v<version>
  # (Frontend-v3.5.0, Backend-v3.4.0, Plugin-v2.0.1.0) and each release body is
  # that component's CHANGELOG.md section, so a green version bump auto-publishes
  # a release linked to its notes. Idempotent - versions already released are
  # skipped, so ordinary main pushes are a no-op here.
  release:
    name: Tag + release (main, on version bump)
    needs: [frontend, generated, backend, e2e, plugin, scripts, docs, osv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to detect what's already released

      - name: Tag + release changed component versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh
