name: CI

# The full quality gate on every push and pull request, on shared-tooling's reusable
# workflows at the release the shared/ submodule holds (the docs job fails if the two
# ever differ): the Vue/TS frontend, the Go backend, the FFXIV plugin, the PowerShell
# scripts and the docs. scripts/check.ps1 runs the same checks locally.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint is lint:check, which never rewrites; test:coverage fails below the floor in
  # vitest.config.ts. web.yml runs the audit itself. The API types it compiles against
  # are the committed ones, which the generated job checks. The build is uploaded for
  # the backend job, since the binary embeds it.
  frontend:
    uses: jwill89/shared-tooling/.github/workflows/web.yml@v2.6.0
    with:
      dir: frontend
      fontawesome: true
      scripts: lint:check format:check lint:conventions typecheck test:coverage build
      artifact-path: backend/internal/web/dist
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  # The code generated from the schema and the API is what the generators make now
  # (task gen): sqlc's queries
  # (backend/internal/db), the OpenAPI document huma renders
  # (frontend/src/api/openapi.json), the SPA's types from it (schema.d.ts), and, until
  # every domain has moved to huma, tygo's types from the Go models.
  generated:
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The frontend job's node_modules, by the same key, so the Font Awesome kit isn't
      # fetched again; the frontend job always saves it first.
      - name: Frontend dependencies
        uses: actions/cache/restore@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/.nvmrc', 'shared/lint/web/*.js', 'shared/lint/web/*.json', 'shared/test/a11y/*.js', 'shared/test/a11y/*.json') }}
          fail-on-cache-miss: true

      # The binary embeds the front end's build, so go run needs it.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: backend/internal/web/dist

      - name: Generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          cd backend && sqlc generate && go run . openapi > ../frontend/src/api/openapi.json && go tool tygo generate && cd ..
          cd frontend && npx -y openapi-typescript@7.13.0 src/api/openapi.json -o src/api/schema.d.ts && npx prettier --write src/api/schema.d.ts src/api/openapi.json && cd ..
          git diff --exit-code -- backend/internal/db frontend/src/api frontend/src/types/api.generated.ts

  # golangci-lint with backend/.golangci.yml (written from the shared template), the
  # tests under the race detector with their coverage floor (raise it as tests land,
  # never lower it), govulncheck, and
  # the binary built as the deploy builds it - on the frontend job's build, which the
  # binary embeds, so every Go step compiles with it.
  backend:
    needs: frontend
    uses: jwill89/shared-tooling/.github/workflows/go.yml@v2.6.0
    with:
      dir: backend
      download-artifact: web-dist
      download-path: backend/internal/web/dist
      # Counted across packages: the API's request tests live in internal/server and
      # exercise internal/api. scripts/check.ps1 checks the same floor locally.
      coverpkg: ./...
      coverage-floor: 77.5
      # sqlc's generated code is left out of the count: the code that calls it is tested.
      coverage-exclude: |
        /internal/db/(db|models)\.go$
        /internal/db/[^/]+\.sql\.go$
      build: go build -ldflags="-s -w" -o app-suite .

  # Built against Dalamud with warnings as errors (the shared analyzers, imported by
  # plugins/Directory.Build.props), and dotnet format.
  plugin:
    uses: jwill89/shared-tooling/.github/workflows/dotnet.yml@v2.6.0
    with:
      projects: plugins/SenpanCompanion
      warnings-as-errors: true

  # The end-to-end run (frontend/playwright.config.ts): the app as production runs it -
  # the binary, built with the front end's build embedded, serving the API and the SPA -
  # on a throwaway database with Discord held back (-webhook-dry-run), in the runner's
  # Chrome. Every main page must pass axe at WCAG 2.2 AA, and a player must join a
  # board, see a draw arrive live and keep a stamp across a reload.
  e2e:
    needs: [frontend, backend]
    uses: jwill89/shared-tooling/.github/workflows/e2e.yml@v2.6.0
    with:
      dir: frontend
      go-version-file: backend/go.mod
      fontawesome: true
      setup: npm --prefix frontend run build
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  scripts:
    uses: jwill89/shared-tooling/.github/workflows/pwsh.yml@v2.6.0

  docs:
    uses: jwill89/shared-tooling/.github/workflows/docs.yml@v2.6.0

  # OSV-Scanner over every lockfile. An osv-scanner.toml beside a lockfile passes over the
  # advisories that reach only lint, test or build tooling.
  osv:
    uses: jwill89/shared-tooling/.github/workflows/osv.yml@v2.6.0
    permissions:
      contents: read
      actions: read
      security-events: write

  # On a push to main, AFTER the whole gate passes, tag + release a version with no
  # release yet: the app as v<version> (which the deploy ships) and the plugin as
  # Plugin-v<version>, each with its CHANGELOG.md entry as the body, so a green version
  # bump auto-publishes a release linked to its notes. Idempotent - versions already
  # released are skipped, so ordinary main pushes are a no-op here.
  release:
    name: Tag + release (main, on version bump)
    needs: [frontend, generated, backend, e2e, plugin, scripts, docs, osv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to detect what's already released

      - name: Tag + release a new app or plugin version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh
