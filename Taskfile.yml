version: '3'

# Day-to-day commands; `task` alone lists them. scripts/check.ps1 stays the one quality
# gate (CI mirrors it); the lint and test tasks here run pieces of it on their own.

# The tasks every repo shares, from the shared-tooling submodule (shared:lint:scripts,
# shared:lint:md, shared:update and the rest).
includes:
  shared: ./shared/repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the frontend's dependencies (run `git submodule update --init` once first)
    dir: frontend
    cmds:
      # --prefer-offline: the Font Awesome Pro kit installs from npm's cache unless the lockfile changed.
      - npm ci --prefer-offline

  dev:
    desc: Run the API on :8080 and the Vite dev server on :5173 together (open http://localhost:5173)
    deps: [dev:backend, dev:frontend]

  dev:backend:
    desc: Run the API on :8080 against devdata, with Discord webhooks held back
    dir: backend
    cmds:
      # devdata is a copy of the live database, real webhook URLs included.
      - 'go run . -addr :8080 -db ../devdata/database.sqlite -webroot ../devdata/webroot -log-file "" -webhook-dry-run'

  dev:frontend:
    dir: frontend
    cmds:
      - npm run dev

  gen:
    desc: Regenerate the frontend's API types from the Go models (tygo), after a model change; commit the result
    dir: frontend
    cmds:
      - npm run gen:types

  build:
    desc: Build the frontend into frontend/dist and compile the backend
    cmds:
      - cd frontend && npm run build
      - cd backend && go build ./...

  build:plugin:
    desc: Build the Dalamud plugin in Release against this machine's Dalamud (XIVLauncher)
    dir: plugins/SenpanCompanion
    cmds:
      - dotnet build -c Release

  test:
    desc: Run the frontend (Vitest) and backend (Go) tests
    aliases: [tests, test:unit, tests:unit]
    cmds:
      - task: test:frontend
      - task: test:backend

  test:frontend:
    desc: Run the frontend's Vitest tests
    aliases: [tests:frontend]
    dir: frontend
    cmds:
      - npm test

  test:e2e:
    desc: Run the end-to-end suite (Playwright and axe) on the built SPA and the API, on a throwaway database
    aliases: [tests:e2e]
    dir: frontend
    cmds:
      - npm run test:e2e

  test:backend:
    desc: Run the Go tests (CI adds -race, which needs gcc here)
    aliases: [tests:backend]
    dir: backend
    cmds:
      - go test ./...

  lint:
    desc: Lint, format-check, and type-check the frontend, backend, scripts and docs
    cmds:
      - task: lint:frontend
      - task: lint:backend
      - task: lint:scripts
      - task: shared:lint:md
      - task: shared:repo:check
      - task: shared:version:check

  lint:frontend:
    dir: frontend
    cmds:
      - npm run lint:check
      - npm run format:check
      - npm run lint:conventions
      - npm run typecheck

  lint:backend:
    cmds:
      # backend/.golangci.yml is the shared template's; Senpan's rules are in .golangci.local.yml.
      - task: shared:golangci:check
        vars: { CLI_ARGS: '-dir backend' }
      - task: lint:backend:go

  lint:backend:go:
    internal: true
    dir: backend
    cmds:
      - go vet ./...
      # Built from source with the pinned toolchain, the same way CI installs it.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

  # PSScriptAnalyzer, with the shared settings, on every tracked script (the local
  # deploy.config.ps1 is the owner's and untracked). Install it once with
  # Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository
  lint:scripts:
    cmds:
      - task: shared:lint:scripts

  vuln:
    desc: Check dependencies for known vulnerabilities
    cmds:
      # The version shared-tooling's go.yml runs in CI.
      - cd backend && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - cd frontend && npm audit --audit-level=high --omit=dev

  check:
    desc: Everything CI runs (scripts/check.ps1); -- -SkipFrontend or -- -SkipBackend for half
    cmds:
      - pwsh -NoProfile -File scripts/check.ps1 {{.CLI_ARGS}}

  deploy:frontend:
    desc: Build and deploy the frontend, the script's default (pass flags after --, e.g. -- -SkipBuild)
    aliases: [deploy]
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target frontend {{.CLI_ARGS}}

  deploy:backend:
    desc: Deploy the backend, then pull the live database into devdata (-- -NoDbPull skips the pull)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target backend {{.CLI_ARGS}}

  deploy:both:
    desc: Deploy the backend, then the frontend
    aliases: [deploy:main]
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target both {{.CLI_ARGS}}

  deploy:all:
    desc: Deploy the backend, the frontend, then the plugin
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target all {{.CLI_ARGS}}

  deploy:plugin:
    desc: Build the Dalamud plugin and publish it to its custom repo
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target plugin {{.CLI_ARGS}}
