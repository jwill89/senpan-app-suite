# The VirtualHosts of the three names the app answers, installed at
# /etc/apache2/sites-available/<service>.conf by every app deploy (scripts/deploy.ps1)
# where it differs, which keeps the one before if `apachectl configtest` refuses this
# one. The deploy fills in __APP__, the address on the service's -addr, and __CERT__,
# the certificate under /etc/letsencrypt/live that covers the three names (its CertName
# setting).
#
# Nothing is served from a document root: every path of every name goes to the app,
# which serves the API, its event streams, the SPA and the data folder's public files.
#   apps.senpan.cafe   -> the app as it is
#   fonts.senpan.cafe  -> /api/v1/fonts/pub/ (kit.css and the tokenized font links)
#   carrd.senpan.cafe  -> /carrd/ (the Carrd projects' files)
# The fonts are never a plain file on any of them: the app serves them only through
# their links, and nothing here points at the folder that holds them.
#
# Cloudflare fronts all three names.

<VirtualHost *:80>
    ServerName apps.senpan.cafe
    ServerAlias fonts.senpan.cafe carrd.senpan.cafe
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    Protocols h2 h2c http/1.1

    RewriteEngine on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName apps.senpan.cafe
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    Protocols h2 h2c http/1.1

    ProxyPreserveHost On
    # The live event streams (/api/v1/events, /api/v1/board/{id}/events) stay open; the
    # app pings each every 25 seconds, well inside this timeout and Cloudflare's 100 seconds.
    ProxyPass        / http://__APP__/ timeout=3600
    ProxyPassReverse / http://__APP__/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # Compressing an event stream would hold its events back in a buffer.
    SetEnvIfNoCase Request_URI "/events$" no-gzip

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/__CERT__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__CERT__/privkey.pem
</VirtualHost>

<VirtualHost *:443>
    ServerName fonts.senpan.cafe
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    Protocols h2 h2c http/1.1

    # https://fonts.senpan.cafe/kit.css and /f/<token>, which outside sites embed, are
    # the app's /api/v1/fonts/pub/kit.css and /api/v1/fonts/pub/f/<token>.
    ProxyPreserveHost On
    ProxyPass        / http://__APP__/api/v1/fonts/pub/
    ProxyPassReverse / http://__APP__/api/v1/fonts/pub/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/__CERT__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__CERT__/privkey.pem
</VirtualHost>

<VirtualHost *:443>
    ServerName carrd.senpan.cafe
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    Protocols h2 h2c http/1.1

    # https://carrd.senpan.cafe/<project>/.../<file> is the app's /carrd/<project>/.../<file>,
    # which any site may embed (Access-Control-Allow-Origin: *); the projects' .carrd.json
    # and folder listings are never served.
    ProxyPreserveHost On
    ProxyPass        / http://__APP__/carrd/
    ProxyPassReverse / http://__APP__/carrd/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/__CERT__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__CERT__/privkey.pem
</VirtualHost>
</IfModule>
