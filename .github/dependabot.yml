# Weekly dependency updates: Monday, one pull request per ecosystem for minors and
# patches together, majors one by one, since they can need code changes. The shared/
# submodule is left out: a release of it is taken on purpose (`task shared:update`).
#
# Dependabot can't read Actions secrets: the Font Awesome Pro registry needs
# FONTAWESOME_NPM_TOKEN added as a Dependabot secret too (Settings, Secrets and
# variables, Dependabot).
version: 2

registries:
  fontawesome:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /frontend
    registries:
      - fontawesome
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Held on purpose: TypeScript stays on 6.x until vue-tsc supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 turns a `//` in a static attribute (placeholder="https://") into
      # broken virtual code, which stops it checking the rest of that template, so it is
      # held at 3.3.13. Only that version is skipped, so a fix comes through.
      - dependency-name: vue-tsc
        versions: ['3.3.14']
      # The lint tools in shared/lint/web change major version together with the plugins
      # and configs that must match them, and arrive with `task shared:update`; a plugin
      # of our own for one moves with it. Minors and patches still come here.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      - dependency-name: prettier
        update-types: ['version-update:semver-major']
      - dependency-name: stylelint
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint-*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /plugins/SenpanCompanion
    schedule:
      interval: weekly
      day: monday
    groups:
      dotnet:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
