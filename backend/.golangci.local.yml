# Senpan's own golangci-lint rules, merged on top of the shared template
# (shared/lint/go/golangci.template.yml) into .golangci.yml. Edit this file, then run
# `go run -C shared/lint/go . -dir backend` from the repo root and commit both.
linters:
  settings:
    errcheck:
      exclude-functions:
        # A deferred rows.Close follows a loop that has read to the end and checked rows.Close
        # and rows.Err (sqlc's generated methods are written this way). A result set read to
        # the end was already closed by Next, and on an early return the error being
        # returned is the one that matters.
        - (*database/sql.Rows).Close
  exclusions:
    rules:
      # A test closes what it opened - a response body, a test server, a database - once its
      # assertions are made. A failed close changes no verdict and has nobody to tell.
      - path: _test\.go
        linters: [errcheck]
        text: "Error return value of `[^`]*\\.Close` is not checked"
      # The server package's tests lay out data-folder fixtures (images/, carrd/, fonts/)
      # with directories at 0755 and files at 0644, wider than gosec's G301 (0750) and
      # G306 (0600) allow; they hold no credentials.
      - path: internal/server/
        linters: [gosec]
        text: "G30[16]:"
